<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CENTIPEDE</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
    }
    #game-root {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      gap: 8px;
    }
    canvas#screen {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      background: #000;
      box-shadow: 0 0 40px rgba(0, 255, 80, 0.08);
      cursor: none;
    }
    #cabinet-note {
      /* In normal document flow directly below the canvas (not pinned to
         the viewport bottom) so it can never overlap the canvas's own
         bottom row, regardless of how large the canvas scales up to. */
      flex-shrink: 0;
      text-align: center;
      color: #333;
      font-size: 11px;
      letter-spacing: 1px;
      pointer-events: none;
      user-select: none;
    }
    #feature-panel {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(10, 12, 16, 0.92);
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 10px 14px;
      color: #cfeeff;
      font-size: 12px;
      z-index: 10;
      min-width: 200px;
    }
    #feature-panel.open { display: block; }
    #feature-panel h3 {
      margin: 0 0 8px;
      font-size: 12px;
      color: #4be8ff;
      letter-spacing: 1px;
    }
    #feature-panel label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
      cursor: pointer;
    }
    #feature-panel .hint {
      margin-top: 8px;
      color: #666;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div id="game-root">
    <canvas id="screen"></canvas>
    <div id="cabinet-note">MOUSE = TRAK-BALL &nbsp;•&nbsp; CLICK / SPACE = FIRE &nbsp;•&nbsp; ARROW KEYS ALSO WORK &nbsp;•&nbsp; P = PAUSE &nbsp;•&nbsp; F = FEATURES</div>
    <div id="feature-panel">
      <h3>FEATURES</h3>
      <label><input type="checkbox" data-flag="crtFilter" /> CRT scanlines</label>
      <label><input type="checkbox" data-flag="showGrid" /> Show grid</label>
      <label><input type="checkbox" data-flag="debugOverlay" /> Debug overlay</label>
      <label><input type="checkbox" data-flag="godMode" /> God mode</label>
      <label><input type="checkbox" data-flag="slowMotion" /> Slow motion</label>
      <label><input type="checkbox" data-flag="muteAudio" /> Mute audio</label>
      <div class="hint">Press F to close</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
